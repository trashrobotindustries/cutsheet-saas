<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Figure-8 Derby</title>
<link rel="icon" href="data:," />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }

  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button { pointer-events: auto; }

  /* Menu */
  #menu {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 30%, rgba(20,40,70,.7), rgba(0,0,0,.9));
    color: #fff; text-align: center; padding: 24px;
  }
  #menu h1 { font-size: clamp(32px, 7vw, 64px); letter-spacing: 2px; text-shadow: 0 4px 20px #000; }
  #menu p.tag { opacity: .8; max-width: 540px; line-height: 1.4; }
  #class-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 820px; margin-top: 10px; }
  .class-btn {
    width: 190px; padding: 14px; border-radius: 12px; border: 1px solid #3a5a80;
    background: rgba(30,45,70,.85); color: #fff; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 6px; transition: transform .1s, border-color .1s;
  }
  .class-btn:hover { transform: translateY(-3px); border-color: #7fb2ff; }
  .class-btn b { font-size: 17px; }
  .class-btn span { font-size: 12px; opacity: .8; line-height: 1.3; }
  .class-btn .stats { font-size: 11px; opacity: .6; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #menu .hint { font-size: 13px; opacity: .6; margin-top: 8px; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: none;
    justify-content: space-between; align-items: flex-start; padding: 16px 20px;
    color: #fff; text-shadow: 0 2px 6px #000; font-weight: 700;
  }
  #health-wrap { width: 220px; height: 20px; background: rgba(0,0,0,.5); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); }
  #health-fill { height: 100%; width: 100%; background: #4caf50; transition: width .15s, background .2s; }
  #hud .right { text-align: right; }
  #speed { font-size: 26px; font-variant-numeric: tabular-nums; }
  #alive { font-size: 15px; opacity: .9; }
  #status { color: #ff6b6b; font-size: 14px; }

  #center-msg {
    position: absolute; top: 42%; left: 0; right: 0; text-align: center; display: none;
    color: #fff; font-size: clamp(40px, 10vw, 90px); font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 4px 24px #000; line-height: 1.1;
  }
  #center-msg .sub { font-size: 20px; font-weight: 600; opacity: .9; }

  /* Touch controls */
  #touch { position: absolute; inset: 0; display: none; }
  .pad {
    position: absolute; bottom: 26px; width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .pad:active { background: rgba(255,255,255,.4); }
  #btn-left { left: 26px; } #btn-right { left: 124px; }
  #btn-brake { right: 124px; } #btn-gas { right: 26px; height: 104px; border-radius: 42px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="menu">
    <h1>FIGURE-8 DERBY</h1>
    <p class="tag">Race the 8. Everyone meets in the middle. Last truck still running wins.
      Pick your rig — heavy hits harder, light turns quicker.</p>
    <div id="class-list"></div>
    <p class="hint">Drive: <b>W/A/S/D</b> or arrows · on-screen pads on touch · <b>R</b> to rematch</p>
  </div>

  <div id="hud">
    <div class="left">
      <div id="health-wrap"><div id="health-fill"></div></div>
      <div id="status"></div>
    </div>
    <div class="right">
      <div id="speed">0 km/h</div>
      <div id="alive">6 left</div>
    </div>
  </div>

  <div id="center-msg"></div>

  <div id="touch">
    <div id="btn-left" class="pad">◄</div>
    <div id="btn-right" class="pad">►</div>
    <div id="btn-brake" class="pad">▼</div>
    <div id="btn-gas" class="pad">▲</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
